<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Hopper</title>
    <link rel="stylesheet" href="./src/output.css">
    <script src="index.js" type="module"></script>
</head>
<body>
    <header class="bg-[url(../imgs/water_tile.jpg)] object-cover mb-16 p-8">
        <h1 class="text-5xl text-center text-lime-200 bg-green-700 rounded-full border-6 border-green-800 font-limelight font-bold py-6 px-8 mx-auto w-fit">Frog Hopper</h1>
    </header>

    <main>

        <div id="game-grid" class="grid grid-cols-2 grid-rows-2 gap-4 row-1 col-1 mx-auto w-100 align-center bg-[url(../imgs/water_tile.jpg)] rounded-[2rem]">

            <div id="player" class=" w-45 h-45">
                <img src="imgs/lily_pad.png" alt="green lily pad" class="absolute z-2 w-45 h-45">
                <img src="imgs/frog.svg" alt="frog" class="absolute z-3 w-45 h-45 p-8">
            </div>

            <div id="tileTwo" class=" w-45 h-45">
                <img src="imgs/lily_pad.png" alt="green lily pad" class="absolute z-2 w-45 h-45">
            </div>

            <div id="tileThree" class=" w-45 h-45">
                <img src="imgs/lily_pad.png" alt="green lily pad" class="absolute z-2 w-45 h-45">
            </div>

            <div id="tileFour" class=" w-45 h-45">
                <img src="imgs/lily_pad.png" alt="green lily pad" class="absolute z-2 w-45 h-45">
            </div>

        </div>

        <h2 class="text-center text-3xl text-green-700 font-limelight mt-16">Attributions</h2>
        <ul class="w-fit mx-auto mb-4 text-center text-green-800">
            <li class="p-1"><a href="https://freesvg.org/green-sitting-frog-vector" target="_blank" class="cursor-pointer hover:text-lime-500">Green Sitting Frog by OpenClipart</a></li>
            <li class="p-1"><a href="https://www.vecteezy.com/free-vector/lotus" target="_blank" class="cursor-pointer hover:text-lime-500">Lotus Vectors by Vecteezy</a></li>
            <li class="p-1"><a href="https://www.vecteezy.com/free-vector/water" target="_blank" class="cursor-pointer hover:text-lime-500">Water Vectors by Vecteezy</a></li>
        </ul>
    
    </main>

    
</body>
</html>
